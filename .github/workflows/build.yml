name: Java JAR Build Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile and Package JAR
      run: |
        gradle jar
            - name: Upload Finished JAR File
      uses: actions/upload-artifact@v4.4.3
      with:
        name: PrestigeClientGUI-JAR
        path: build/libs/*.jar
        
